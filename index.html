<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF7F2">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>zeanDO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FAF7F2' stroke='%23C2552B' stroke-width='2'/%3E%3Cpath d='M10 21l12-12M10 10h12v12' fill='none' stroke='%232B2620' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
</head>
<body>

<!-- 图标集：单一线性风格，24 网格 / 1.75px 描边（手册 §6） -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </g>
  </symbol>
  <symbol id="i-grid" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </g>
  </symbol>
  <symbol id="i-checks" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6l1.5 1.5L7 5M10 6h11"/>
      <path d="M3 12l1.5 1.5L7 11M10 12h11"/>
      <path d="M3 18l1.5 1.5L7 17M10 18h11"/>
    </g>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12h14"/>
    </g>
  </symbol>
  <symbol id="i-user" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
    </g>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12l4 4L19 6"/>
    </g>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    </g>
  </symbol>
  <symbol id="i-alert" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>
    </g>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
    </g>
  </symbol>
</svg>

<div id="storage-banner" class="storage-banner" hidden></div>

<main id="view" class="view" aria-live="polite"></main>

<!-- 底部导航：三页签 + ⊕ 落笔键，四格布局（手册 §8.1） -->
<nav class="tabbar" aria-label="主导航">
  <button class="tab" data-tab="today">
    <svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg>
    <span>今日</span>
  </button>
  <button class="tab" data-tab="schedule">
    <svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>
    <span>课表</span>
  </button>
  <button class="tab tab-plus" id="btn-plus" aria-label="落笔：快速记录">
    <span class="plus-circle">
      <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
    </span>
  </button>
  <button class="tab" data-tab="todos">
    <svg class="icon" aria-hidden="true"><use href="#i-checks"/></svg>
    <span>待办</span>
  </button>
</nav>

<!-- ⊕ 落笔半屏 -->
<div id="sheet" class="sheet" hidden aria-hidden="true">
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="快速记录">
    <div id="sheet-content"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/storage.js"></script>
<script src="js/util.js"></script>
<script src="js/app.js"></script>
<script src="js/capture.js"></script>
<script src="js/course-sheets.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/schedule.js"></script>
<script src="js/views/todos.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/settings.js"></script>
</body>
</html>
